  <style>
    /* Paint the screen before fonts, the stylesheet, or the intro are ready. */
    html { min-height: 100%; background: #060606; color-scheme: dark; }
    body { margin: 0; isolation: isolate; }
    .site-backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #060606; }
    .grain-particles { position: absolute; inset: 0; background: url('assets/background-grain.png') center top / 480px auto repeat; }
    main { position: relative; z-index: 1; }
    @media (max-width: 700px) {
      /* Safari fills its status bar and the strip under its toolbar with flat colour
         the page cannot draw over. The grain eases in and out of #060606 at both
         edges so those bars read as part of the page. The layer itself stays clear:
         Safari reuses a fixed layer's colour under the toolbar, which would cover
         the portrait there. The html background already supplies #060606. */
      .site-backdrop {
        background: transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, .12) 40px, rgba(0, 0, 0, .45) 96px, #000 180px, #000 calc(100% - 160px), rgba(0, 0, 0, .35) calc(100% - 60px), transparent);
        mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, .12) 40px, rgba(0, 0, 0, .45) 96px, #000 180px, #000 calc(100% - 160px), rgba(0, 0, 0, .35) calc(100% - 60px), transparent);
      }
    }
  </style>

          <defs>

            <mask id="portrait-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1015" height="1549" style="mask-type: luminance">

            <filter id="portrait-darken" color-interpolation-filters="sRGB">

            <linearGradient id="portrait-shade-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="25%" stop-color="white" stop-opacity="0" />
              <stop offset="37%" stop-color="white" />
            </linearGradient>
            <mask id="portrait-shading" maskUnits="userSpaceOnUse" x="0" y="0" width="1015" height="1549" style="mask-type: alpha">
              <rect width="1015" height="1549" fill="url(#portrait-shade-gradient)" />
            </mask>
          </defs>
          <g id="josh-portrait-figure" mask="url(#portrait-cutout)">
            <image href="assets/josh_portrait_cartoon_bw.png" width="1015" height="1549" />
            <image filter="url(#portrait-darken)" href="assets/josh_portrait_cartoon_bw.png" width="1015" height="1549" mask="url(#portrait-shading)" />
