<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="Joshua Kirabo — a creative mind bringing ideas to life through design and development.">
  <title>JOSH — Joshua Kirabo</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/josh_portrait_cartoon_bw.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/fonts/unbounded-latin-700-overlap.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/josh_portrait_cartoon_mask.png" as="image">
  <script>
    // Hide only when the browser can run the intro; otherwise show the page normally.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !location.hash &&
        typeof Element.prototype.animate === 'function' && CSS.supports('translate', '0 0')) {
      document.documentElement.classList.add('intro-pending');
      window.introFallback = setTimeout(() => {
        document.documentElement.classList.remove('intro-pending');
      }, 8000);
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#intro">Skip to content</a>
  <main>
    <section class="hero" id="home" aria-label="Joshua Kirabo, creative developer">
      <div class="wordmark" aria-hidden="true">JOSH</div>
      <header class="site-header">
        <nav class="nav-group" aria-label="Main navigation">
          <a class="nav-link" href="#home" aria-current="page"><span class="nav-label">Home</span></a>
          <span class="nav-divider" aria-hidden="true"></span>
          <a class="nav-link" href="https://github.com/JoshuaKirabo" target="_blank" rel="noopener noreferrer"><span class="nav-label">Projects</span></a>
        </nav>
        <div class="nav-group nav-group-right">
          <span class="small-label">Ask Josh</span>
          <span class="nav-divider" aria-hidden="true"></span>
          <a class="nav-link" href="https://github.com/JoshuaKirabo" target="_blank" rel="noopener noreferrer"><span class="nav-label">Let’s connect</span></a>
        </div>
      </header>

      <div class="portrait-stage">
        <img class="portrait portrait-cartoon" src="assets/josh_portrait_cartoon_bw.png" width="1015" height="1549" alt="Black-and-white cartoon portrait of Joshua Kirabo wearing glasses and a white textured shirt" fetchpriority="high">
        <img class="portrait portrait-cartoon portrait-shade" src="assets/josh_portrait_cartoon_bw.png" width="1015" height="1549" alt="" aria-hidden="true">
      </div>

      <div class="hero-content" id="intro" tabindex="-1">
        <h1><span class="hero-heading-line">Ideas,</span><br><span class="hero-heading-line">Made</span><br><span class="hero-heading-line">Different.</span></h1>
        <a class="button button-primary" href="https://github.com/JoshuaKirabo" target="_blank" rel="noopener noreferrer"><span>Meet Josh</span><span class="button-arrow" aria-hidden="true">↗</span></a>
      </div>

      <div class="hero-footer">
        <span class="signature">Joshua Kirabo<br><span>Design & development</span></span>
        <span class="edition">A new chapter.<br><span>© <span data-year>2026</span></span></span>
      </div>
    </section>

  </main>
</body>
</html>
