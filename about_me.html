    @media (max-width: 700px) {
      /* Safari fills its status bar and the strip under its toolbar with flat colour
         the page cannot draw over. The grain eases in and out of #060606 at both
         edges so those bars read as part of the page. The layer itself stays clear:
         Safari reuses a fixed layer's colour under the toolbar, which would cover
         the portrait there. The html background already supplies #060606. */

        background: transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, .12) 40px, rgba(0, 0, 0, .45) 96px, #000 180px, #000 calc(100% - 160px), rgba(0, 0, 0, .35) calc(100% - 60px), transparent);

      }
    }
