<svg xmlns="http://www.w3.org/2000/svg" width="600" height="378" viewBox="0 0 600 378" role="img" aria-labelledby="title desc">
  <title id="title">Flattening a survey response</title><desc id="desc">Field lines from a SurveyCTO form split into a submission row and repeat rows. Matching square marks show the parent key carried into both outputs. This is an illustration of record structure.</desc>
