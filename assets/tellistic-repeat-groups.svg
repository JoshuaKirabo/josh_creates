    .fine { stroke:#474745; stroke-width:.8; }
    .boundary { stroke:#ededeb; stroke-width:1.1; }
    .rule { stroke:#474745; }
    .ink { fill:#ededeb; } .muted { fill:#a4a4a0; }
    .key { fill:#ededeb; } .cell { fill:#0b0b0b; stroke:#a4a4a0; stroke-width:.9; }
    .label,.caption,.note { font-family:Arial,Helvetica,sans-serif; font-weight:400; fill:#ededeb; }
    .label { font-size:17px; letter-spacing:-.55px; }
    .caption { font-size:20px; letter-spacing:-.65px; }
    .note { font:11.5px Menlo,Consolas,monospace; fill:#a4a4a0; }
  </style>
